log_format privacy '$request_method $uri $server_protocol $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;
  access_log /dev/stdout privacy;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 55m;
  server_tokens off;
  # Only Traefik may reach this pod (06-network-policy.yaml). Traefik must
  # sanitize untrusted forwarded headers; never enable forwardedHeaders.insecure.
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Real-IP;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/ebook-security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 'ok';
    default_type text/plain;
  }

  location = /readyz {
    proxy_pass http://ebook-api:3000/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/ {
    proxy_pass http://ebook-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }

  # Crawler files are generated from the catalogue, not baked into the bundle:
  # a sitemap shipped with the static build is stale the moment a chapter is
  # published. They are served from the site root (never /api/) because that is
  # where a crawler looks for them.
  location = /robots.txt {
    proxy_pass http://ebook-api:3000/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~ ^/sitemap[-a-z0-9]*\.xml$ {
    proxy_pass http://ebook-api:3000$uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/ebook-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    include /etc/nginx/ebook-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    include /etc/nginx/ebook-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
