log_format privacy '$request_method $uri $server_protocol $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;
  access_log /dev/stdout privacy;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 55m;

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location = /readyz {
    proxy_pass http://ebook-api:3000/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://ebook-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }

  # Crawler files are generated from the catalogue, not baked into the bundle:
  # a sitemap shipped with the static build is stale the moment a chapter is
  # published. They are served from the site root (never /api/) because that is
  # where a crawler looks for them.
  location = /robots.txt {
    proxy_pass http://ebook-api:3000/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/sitemap[-a-z0-9]*\.xml$ {
    proxy_pass http://ebook-api:3000$uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
