apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebook-web
  namespace: ebook-reader
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ebook-web
  template:
    metadata:
      labels:
        app: ebook-web
    spec:
      containers:
        - name: web
          image: git.913555.xyz/etklam/ebook-reader-web:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ebook-web
  namespace: ebook-reader
spec:
  selector:
    app: ebook-web
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ebook-reader
  namespace: ebook-reader
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    external-dns.alpha.kubernetes.io/hostname: book.7182818.xyz
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - book.7182818.xyz
      secretName: ebook-reader-tls
  rules:
    - host: book.7182818.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ebook-web
                port:
                  number: 8080
