apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebook-db-data
  namespace: ebook-reader
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebook-storage
  namespace: ebook-reader
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 12Gi
